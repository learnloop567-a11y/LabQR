<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabQR - Smart Laboratory Guide</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#edf3ff}
header{padding:28px 20px;background:#121d30;border-bottom:1px solid #293750}
header h1{margin:0;font-size:34px}
header p,.muted{color:#aab8ce;line-height:1.7}
main{max-width:850px;margin:auto;padding:24px 18px}
input{width:100%;padding:17px;border-radius:15px;border:1px solid #34435f;background:#101b2d;color:white;font-size:17px;margin:12px 0 24px}
.card{background:#121d30;border:1px solid #2b3b55;padding:20px;border-radius:17px;margin:16px 0}
.card h2{margin-top:0}
button,.btn{border:0;border-radius:10px;padding:12px 16px;background:#1e66db;color:white;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:5px 5px 5px 0}
section{margin:22px 0;line-height:1.8}
h3{color:#7fb4ff}
table{border-collapse:collapse;width:100%;margin:12px 0}
td,th{border:1px solid #52617a;padding:9px;text-align:center}
footer{text-align:center;padding:25px;color:#aab8ce}
.hidden{display:none}
.back{background:#34435f}
</style>
</head>
<body>
<header>
<h1>🧪 LabQR</h1>
<p>Smart Laboratory Guide · Scan. Learn. Practise.</p>
</header>

<main>
<div id="home">
<h2>Your practicals, one scan away.</h2>
<p class="muted">Find experiment aims, apparatus, theory, procedures and viva revision.</p>
<input id="search" placeholder="Search experiments..." oninput="render()">
<div id="list"></div>
</div>

<div id="detail" class="hidden"></div>
</main>

<footer>LabQR · Student Laboratory Reference</footer>

<script>
const experiments=[
{
slug:"rtd-characteristics",
number:"01",
title:"Study of RTD Characteristics",
aim:"To study the characteristics of a Resistance Temperature Detector (RTD) and observe how resistance changes with temperature.",
apparatus:"RTD sensor, connecting wires, multimeter, thermometer and water-heating setup.",
theory:"An RTD (Resistance Temperature Detector) is a temperature sensor that measures temperature by detecting changes in electrical resistance. It works on the principle that the electrical resistance of a metal changes with temperature. When the temperature increases, the resistance of the sensing element generally increases. Platinum is commonly used in RTDs because it offers good accuracy, stability, repeatability, and corrosion resistance. RTDs are available in wire-wound and thin-film constructions. The resistance-temperature relationship can be expressed as Rₜ = R₀[1 + α(T − T₀)], where Rₜ is the resistance at temperature T, R₀ is the resistance at reference temperature T₀, and α is the temperature coefficient of resistance. An RTD acts as a transducer by converting a temperature change into a measurable resistance change. In this experiment, the RTD is heated gradually in water, and its resistance is recorded at regular temperature intervals. A graph of resistance against temperature is plotted to study the relationship between resistance and temperature. RTDs are widely used in industrial process control, laboratories, chemical plants, and temperature monitoring systems. Their main advantages are high accuracy, good stability, and repeatable readings. Their limitations include a relatively high cost, slower response than some temperature sensors, and the need for a suitable measuring circuit.",
procedure:[
"Connect the RTD to the measuring instrument.",
"Record the initial temperature and resistance.",
"Heat the water gradually and carefully.",
"Record resistance at regular temperature intervals.",
"Plot resistance against temperature."
],
observation:"Record the temperature and corresponding resistance readings in an observation table.",
result:"The relationship between RTD resistance and temperature can be studied from the recorded observations.",
viva:[
["What is an RTD?","A temperature sensor that measures temperature using changes in electrical resistance."],
["What does RTD stand for?","Resistance Temperature Detector."],
["What happens to the resistance of a common metallic RTD when temperature rises?","Its resistance generally increases."],
["Name one commonly used RTD material.","Platinum."]
]
},
{
slug:"logic-gates-universal-nand",
number:"02",
title:"Logic Gates and Universal NAND Gate",
aim:"To verify the truth tables of NOT, AND, OR, NAND and NOR gates and demonstrate NAND as a universal gate.",
apparatus:"Digital trainer kit, connecting wires and ICs 7404, 7408, 7432, 7400 and 7402.",
theory:"Logic gates are the basic building blocks of digital electronic circuits. They operate on binary inputs, represented by 0 and 1, and produce a binary output according to a logical rule. The NOT gate produces the complement of its input, so an input of 0 gives an output of 1 and an input of 1 gives an output of 0. The AND gate produces an output of 1 only when all its inputs are 1. The OR gate produces an output of 1 when at least one input is 1. The NAND gate is the complement of the AND gate, so its output is 0 only when all its inputs are 1. The NOR gate is the complement of the OR gate, so its output is 1 only when all its inputs are 0. Boolean algebra is used to represent and analyse these logical operations. A NAND gate is called a universal gate because NOT, AND, and OR operations can all be constructed using NAND gates alone. A NOT gate can be made by connecting both inputs of a NAND gate together. An AND gate can be made by connecting the output of a NAND gate to another NAND gate configured as NOT. An OR gate can be made by applying De Morgan’s theorem and using NAND gates as inverters at its inputs. In this experiment, ICs 7404, 7408, 7432, 7400, and 7402 are used to study the NOT, AND, OR, NAND, and NOR gates, and the universal property of the NAND gate is demonstrated. Logic gates are widely used in computers, calculators, digital controllers, and other electronic systems.",
procedure:[
"Switch off the trainer supply before making connections.",
"Insert the required IC and check its pin configuration.",
"Connect power and ground according to the IC datasheet.",
"Apply input combinations and observe the outputs.",
"Compare the outputs with the truth tables."
],
observation:"For two-input gates, record outputs for 00, 01, 10 and 11.",
result:"The truth tables of the selected logic gates can be verified experimentally.",
viva:[
["What is a logic gate?","A digital circuit that performs a Boolean operation."],
["What is the output of an AND gate for inputs 1 and 1?","1."],
["What is the output of a NAND gate for inputs 1 and 1?","0."],
["Why is NAND called a universal gate?","Because other basic logic gates can be implemented using NAND gates alone."]
]
},
{
slug:"flip-flops",
number:"03",
title:"Study of Flip-Flops",
aim:"To study the operation and truth tables of S-R, J-K, D-type and T-type flip-flops.",
apparatus:"Digital trainer kit, connecting wires and IC 7400 where applicable, along with suitable flip-flop ICs.",
theory:"A flip-flop is a basic sequential logic circuit that stores one bit of binary information. Unlike a combinational circuit, whose output depends only on its present inputs, a flip-flop can retain its previous state. Flip-flops are constructed using logic gates and are widely used in digital memory and control circuits. The S-R flip-flop has Set and Reset inputs. Set makes the output Q equal to 1, while Reset makes Q equal to 0. When both inputs are inactive, the circuit retains its previous state. In the basic S-R NAND implementation, the condition in which both inputs are 0 is invalid because both outputs can become 1, violating the normal complementary-output condition. The J-K flip-flop improves on the S-R flip-flop. When J and K are both 0, it retains its state; when J is 1 and K is 0, it sets; when J is 0 and K is 1, it resets; and when both J and K are 1, it toggles its output. The D flip-flop has a single data input. On the active clock edge, the value at D is transferred to Q and stored until the next triggering edge. The T flip-flop changes its output when T is 1 at the active clock edge and retains its state when T is 0. A clock signal controls when a flip-flop updates its state. Flip-flops are used in registers, counters, memory units, frequency dividers, and digital control systems. In this experiment, the behaviour of S-R, J-K, D-type, and T-type flip-flops is studied using logic gates and the appropriate circuit connections. Their truth tables are used to verify the output for different input combinations.",
procedure:[
"Switch off the supply before making connections.",
"Identify the required IC and verify its pin configuration.",
"Connect the circuit according to the practical-journal diagram and IC datasheet.",
"Apply the required inputs and clock pulses.",
"Observe Q and complementary Q outputs where available.",
"Compare the observations with the expected truth table."
],
observation:"Record the inputs, clock condition and resulting outputs for each flip-flop.",
result:"The operation of the selected flip-flops can be studied by comparing observed outputs with their truth tables.",
viva:[
["What is a flip-flop?","A bistable sequential circuit that stores one bit."],
["What does a D flip-flop do?","It transfers the D input to the output at the active triggering event."],
["What is a clock signal?","A timing signal used to control state changes in synchronous circuits."],
["How many stable states does a flip-flop have?","Two."]
]
}
];

function render(){
const q=document.getElementById("search").value.toLowerCase();
document.getElementById("list").innerHTML=experiments
.filter(e=>(e.title+" "+e.aim+" "+e.slug).toLowerCase().includes(q))
.map(e=>`<div class="card">
<h2>Experiment ${e.number}</h2>
<h3>${e.title}</h3>
<p class="muted">${e.aim}</p>
<button onclick="openExperiment('${e.slug}')">View Experiment</button>
<button onclick="copyLink('${e.slug}')">Copy QR Link</button>
</div>`).join("");
}

function openExperiment(slug){
const e=experiments.find(x=>x.slug===slug);
if(!e)return;
document.getElementById("home").classList.add("hidden");
const d=document.getElementById("detail");
d.classList.remove("hidden");
d.innerHTML=`<button class="back" onclick="goHome()">← All Experiments</button>
<h2>Experiment ${e.number}</h2>
<h1>${e.title}</h1>
<section><h3>Aim</h3>${e.aim}</section>
<section><h3>Apparatus Required</h3>${e.apparatus}</section>
<section><h3>Theory</h3>${e.theory}</section>
<section><h3>Procedure</h3><ol>${e.procedure.map(x=>`<li>${x}</li>`).join("")}</ol></section>
<section><h3>Observations</h3>${e.observation}</section>
<section><h3>Result</h3>${e.result}</section>
<section><h3>Viva Questions and Answers</h3>${e.viva.map(v=>`<div class="card"><b>Q. ${v[0]}</b><p>${v[1]}</p></div>`).join("")}</section>
<button onclick="copyLink('${e.slug}')">Copy Experiment Link</button>`;
history.pushState({}, "", "?experiment="+e.slug);
window.scrollTo(0,0);
}

function goHome(){
document.getElementById("detail").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
history.pushState({}, "", location.pathname);
window.scrollTo(0,0);
}

function copyLink(slug){
const url=location.origin+location.pathname+"?experiment="+slug;
if(navigator.clipboard && window.isSecureContext){
navigator.clipboard.writeText(url).then(()=>alert("Experiment link copied!"));
}else{
prompt("Copy this experiment link:",url);
}
}

function loadRoute(){
const slug=new URLSearchParams(location.search).get("experiment");
if(slug)openExperiment(slug);
}
window.addEventListener("popstate",()=>{
document.getElementById("detail").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
const slug=new URLSearchParams(location.search).get("experiment");
if(slug)openExperiment(slug);
});
render();
loadRoute();
</script>
</body>
</html>
